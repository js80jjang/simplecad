<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>심플 실측</title>
<meta name="theme-color" content="#0A1222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="심플 실측">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
<!--
  심플 실측 (2026-11-17 간단한 구조로 다시) — 휴대폰(안드로이드·아이폰)에서 손가락으로 상판을 그리고 숫자판으로 치수를 넣어
  심플 캐드 파일(.ceramic) + 그림(PNG)을 카톡·문자로 보내는 앱. 파일 하나(인라인), 외부 라이브러리 없음, 제품 검색은 ../mall-catalog.js
  - 왼쪽 도구 탭(본앱처럼 묶음): 그리기(사각·직선·원형·타공) / 객체삽입(싱크볼·쿡탑·식기세척기·음식물투입구) / 추가가공(모서리 라운드·밑면연마·졸리컷·고스라) / 기타 표기(원형·텍스트·연결표시·지시선)
  - 조각 = 닫힌 꺾은선 {x0,y0, e:[{a:각도(0 오른쪽, 90 아래), L:mm, g 밑면연마, s 고스라, j 졸리컷}], cf:{g,s,j} 닫는 변, r:{꼭짓점 번호: 라운드 R}, rect:사각이면 true}. 닫는 변 길이는 자동
    원형 = {circ:true, x,y(가운데), d} — 다른 조각 안이면 원형 커팅(구멍), 밖이면 원형 조각. (예전 파일의 e.m / mc = 밑면연마+고스라로 읽음)
  - 객체 = {t, x,y(가운데 mm), w,h | d}. 표기 ann = {t:'text'|'circle'|'link'|'arrow', ...}. 좌표 x 오른쪽, y 아래(= 앞)
  - 쓰던 내용은 이 기기 IndexedDB('simple-measure', 키 'doc2')에 자동 저장
-->
<style>
:root{--bg:#060B16;--pn:#0A1222;--in:#121D33;--bd:#1C2A47;--bt:#16233D;--sel:#1F3F7A;--selb:#2A4F92;--gold:#E3B861;--gold2:#F1D69A;--tx:#D9DFEA;--tx2:#A9B4C8;--tx3:#75839C;--or:#F0883E;--rail:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'NanumSquare','나눔스퀘어','Malgun Gothic','맑은 고딕',-apple-system,sans-serif;font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column}
button{font:inherit;color:var(--tx);background:var(--bt);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer}
button:active{filter:brightness(1.35)}
#filebar{flex:none;display:flex;gap:4px;padding:calc(5px + env(safe-area-inset-top)) 6px 0;background:var(--pn)}
#filebar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;font-size:11px;white-space:nowrap;overflow:hidden}
#filebar button i{font-style:normal;font-size:17px;line-height:1;position:relative}
#f-save.dirty i::after{content:'';position:absolute;right:-6px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--or)}
header{flex:none;background:var(--pn);border-bottom:1px solid var(--bd);padding:5px 6px 6px;display:flex;align-items:center;gap:6px}
header .site{flex:1;min-width:0;text-align:left;background:var(--in);padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .site b{color:var(--gold)}
#b-send{background:var(--gold);border-color:var(--gold);color:#060B16;font-weight:800}
#files-bd .big{display:block;width:100%;padding:13px;font-size:15px;margin-bottom:8px;text-align:left}
#files-bd h4{margin:16px 2px 8px;color:var(--tx2);font-size:13px}
.fi{display:flex;align-items:center;gap:8px;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px 10px;margin-bottom:6px}
.fi.cur{border-color:var(--gold)}
.fi div{flex:1;min-width:0}.fi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi small{color:var(--tx3);font-size:11.5px}
.fi button{padding:6px 10px;font-size:13px;border-color:#5a2a2a;color:#f0a0a0}
#wrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:var(--rail);top:0;right:0;bottom:0;width:calc(100% - var(--rail));height:100%;touch-action:none;background:#0d1628}
#hint{position:absolute;left:calc(var(--rail) + 8px);right:8px;top:8px;text-align:center;pointer-events:none;color:var(--gold2);font-size:13px;text-shadow:0 1px 3px #000}
#warn{position:absolute;left:calc(var(--rail) + 8px);right:8px;bottom:calc(8px + env(safe-area-inset-bottom));text-align:center;pointer-events:none;color:#ff9a8a;font-size:12.5px;text-shadow:0 1px 3px #000}
/* 왼쪽 도구 탭 */
#rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail);background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:5px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-y:auto;scrollbar-width:none;z-index:5}
#rail::-webkit-scrollbar{display:none}
#rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;line-height:1.15;border-radius:9px;word-break:keep-all;text-align:center}
#rail button i{font-style:normal;font-size:19px;line-height:1}
#rail button.on{background:var(--sel);border-color:var(--gold);color:#fff}
#rail button.open{border-color:var(--gold2)}
#rail .sep{height:1px;background:var(--bd);margin:2px 4px}
#fly{position:absolute;left:calc(var(--rail) + 4px);z-index:6;background:var(--pn);border:1px solid var(--gold);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:5px;min-width:150px;box-shadow:4px 6px 20px rgba(0,0,0,.55)}
#fly .ft{color:var(--gold);font-size:12px;font-weight:800;padding:2px 4px 4px}
#fly button{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;font-size:14px}
#fly button i{font-style:normal;font-size:19px;width:24px;text-align:center}
#fly button.on{background:var(--sel);border-color:var(--gold);color:#fff}
#chips{position:absolute;left:calc(var(--rail) + 8px);right:8px;top:30px;display:none;justify-content:center;gap:6px;z-index:4}
#chips button{padding:6px 10px;font-size:13px;background:rgba(22,35,61,.92)}
#chips button.on{background:var(--sel);border-color:var(--gold);color:#fff}
#b-close{position:absolute;right:10px;bottom:calc(36px + env(safe-area-inset-bottom));z-index:4;display:none;background:var(--gold);border-color:var(--gold);color:#060B16;font-weight:800;padding:11px 16px;font-size:15px}
#fab{position:absolute;z-index:4;display:none;transform:translate(-50%,-100%)}
#fab button{background:#3a1717;border:1px solid #c55;color:#ffb4b4;font-weight:800;padding:7px 12px;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
/* 숫자판 */
#keys{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--pn);border-top:2px solid var(--gold);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:none;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
#keys .tt{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#keys .tt b{flex:1;color:var(--gold)}
#keys .tt button{padding:5px 10px;font-size:13px}
#keys .fl{display:flex;gap:6px;margin-bottom:8px}
#keys .fl div{flex:1;background:var(--in);border:2px solid var(--bd);border-radius:10px;padding:5px 8px;min-width:0}
#keys .fl div.on{border-color:var(--gold)}
#keys .fl small{display:block;color:var(--tx3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#keys .fl span{display:block;font-size:24px;font-weight:800;text-align:right;color:#fff;min-height:30px}
#keys .fl div.on.fresh span{color:var(--gold2)}
#keys .fl.many{gap:4px}#keys .fl.many div{padding:4px 5px}#keys .fl.many span{font-size:19px}#keys .fl.many small{font-size:10px}
#keys .ex{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#keys .ex button{flex:1;padding:8px 6px;font-size:13px;white-space:nowrap}
#keys .ex button.on{background:var(--or);border-color:var(--or);color:#111;font-weight:800}
#keys .ex button.del{border-color:#5a2a2a;color:#f0a0a0}
#keys .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#keys .kg button{padding:12px 0;font-size:22px;font-weight:700;background:var(--in)}
#keys .kg button.ok{grid-row:span 2;background:var(--gold);border-color:var(--gold);color:#060B16;font-size:18px}
/* 정보 창·보내기 창 */
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
.full .hd{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--pn);border-bottom:1px solid var(--bd)}
.full .hd b{flex:1;color:var(--gold);font-size:16px}
.full .bd{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
#info label{display:block;margin-bottom:12px;font-size:12.5px;color:var(--tx2)}
#info input,#info textarea,#ask input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:10px;outline:none;-webkit-user-select:text;user-select:text}
#info textarea{min-height:90px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.photos div{position:relative}
.photos img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
.photos button{position:absolute;top:3px;right:3px;padding:1px 7px;font-size:12px;background:rgba(6,11,22,.8)}
.row2{display:flex;gap:8px;margin-top:16px}.row2 button{flex:1;padding:11px}
#send .pv{display:block;width:100%;border-radius:8px;border:1px solid var(--bd);background:#fff}
#send .big{display:block;width:100%;padding:15px;font-size:17px;font-weight:800;margin-top:10px}
.gold{background:var(--gold)!important;border-color:var(--gold)!important;color:#060B16!important;font-weight:800}
/* 글자 입력 창 */
#ask{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding-top:calc(70px + env(safe-area-inset-top))}
#ask .box{width:min(92vw,420px);background:var(--pn);border:1px solid var(--gold);border-radius:12px;padding:14px}
#ask b{color:var(--gold)}
#ask .row2{margin-top:12px}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--gold);color:#060B16;font-weight:700;padding:9px 16px;border-radius:20px;z-index:40;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<nav id="filebar">
  <button id="f-new"><i>📄</i>새로 만들기</button>
  <button id="f-open"><i>📂</i>열기</button>
  <button id="f-save"><i>💾</i>저장</button>
  <button id="f-saveas"><i>📝</i>다른 이름 저장</button>
  <button id="b-send"><i>📤</i>보내기</button>
</nav>
<header>
  <button class="site" id="b-info"></button>
  <button id="b-undo" title="되돌리기">↶</button>
  <button id="b-fit" title="화면 맞춤">⤢</button>
</header>
<div id="wrap">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="rail"></div><div id="fly"></div>
  <div id="hint"></div><div id="chips"></div><div id="warn"></div>
  <button id="b-close">✔ 닫기</button>
  <div id="fab"><button id="fab-del">🗑 삭제</button></div>
</div>
<div id="keys"></div>
<div id="ask"><div class="box"><b id="ask-t"></b><input id="ask-i" autocomplete="off"><div class="row2"><button id="ask-no">취소</button><button id="ask-ok" class="gold">확인</button></div></div></div>
<div class="full" id="info">
  <div class="hd"><b>현장 정보</b><button id="info-x">닫기</button></div>
  <div class="bd">
    <label>업체명 / 현장 주소<input id="i-site" placeholder="예: 한빛인테리어 / 서울 강남구 역삼동 123" autocomplete="off"></label>
    <label>제품 (윤현몰 목록 검색)<input id="i-prod" list="prod-list" autocomplete="off" placeholder="예: 카라라 1600×3200×12T"></label>
    <datalist id="prod-list"></datalist>
    <label>메모<textarea id="i-memo" placeholder="벽 상태, 고객 요청 등"></textarea></label>
    <label>현장 사진 <button id="b-photo" style="margin-left:6px;padding:4px 10px;font-size:13px">📷 추가</button><input type="file" id="f-photo" accept="image/*" multiple style="display:none"></label>
    <div class="photos" id="photos"></div>
    <div style="color:var(--tx3);font-size:11.5px;margin-top:14px;line-height:1.6">위 "💾 저장"으로 이 휴대폰에 보관하고 "📂 열기"로 다시 엽니다. 인터넷이 되면 항상 최신 버전으로 열립니다.<br>심플 실측 v<span id="ver"></span></div>
  </div>
</div>
<div class="full" id="files">
  <div class="hd"><b>열기</b><button id="files-x">닫기</button></div>
  <div class="bd" id="files-bd"></div>
  <input type="file" id="f-file" style="display:none">
</div>
<div class="full" id="send">
  <div class="hd"><b>보내기</b><button id="send-x">닫기</button></div>
  <div class="bd">
    <img class="pv" id="send-pv" alt="">
    <div id="send-nm" style="color:var(--tx2);font-size:12.5px;margin-top:8px;line-height:1.6"></div>
    <button class="big gold" id="send-share">💬 카톡·문자로 보내기</button>
    <button class="big" id="send-save">💾 휴대폰에 저장</button>
    <div style="color:var(--tx3);font-size:11.5px;margin-top:12px;line-height:1.6">· <b>.ceramic</b> = 심플 캐드에서 여는 도면 파일 (사진·메모 포함)<br>· <b>그림(PNG)</b> = 문자·카톡에서 바로 보이는 실측 그림</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../mall-catalog.js"></script>
<script>
'use strict';
var VER='2026.11.17 (4)';
document.getElementById('ver').textContent=VER;
var OBJ={sink:{nm:'싱크볼',i:'🚰',w:828,h:432,r:24},cook:{nm:'쿡탑',i:'🔥',w:560,h:480,r:0},dish:{nm:'식기세척기',i:'🍽',w:470,h:460,r:0},food:{nm:'음식물투입구',i:'♻️',d:160},
  faucet:{nm:'수전',i:'💧',d:35},outlet:{nm:'콘센트',i:'🔌',d:70},hole:{nm:'사각타공',i:'▭',w:200,h:50,r:0}};
// 객체 위치 기준: 'e' = 모서리(좌측-모서리, 앞변-모서리) / 'c' = 센터(좌측-센터, 앞변-센터) — 이 기기에 기억
var posRef=(function(){try{return localStorage.getItem('sm_posref')||'e';}catch(e){return 'e';}})();
function setPosRef(v){posRef=v;try{localStorage.setItem('sm_posref',v);}catch(e){}}
function half(o){var T=OBJ[o.t];return(o.circ||(T&&T.d))?[o.d/2,o.d/2]:[o.w/2,o.h/2];}
function objR(o){return o.r!=null?o.r:((OBJ[o.t]||{}).r||0);}
// 수전 → 붙은 싱크볼 (o.on = 싱크볼 id)
function sinkOf(o){if(o.t!=='faucet'||!o.on)return null;for(var i=0;i<D.objs.length;i++)if(D.objs[i].id===o.on&&D.objs[i].t==='sink')return D.objs[i];return null;}
function nearSink(o){var best=null,bd=1000;D.objs.forEach(function(s){if(s.t!=='sink')return;var d=Math.hypot(s.x-o.x,s.y-o.y)-Math.max(s.w,s.h)/2;if(d<bd){bd=d;best=s;}});return best;}
function attach(o){if(o.t!=='faucet')return;var s=nearSink(o);if(s)o.on=s.id;else delete o.on;}
var FLAG={g:'밑면연마',s:'고스라',j:'졸리컷'};
// 왼쪽 도구 탭 (본앱 묶음처럼)
var GROUPS=[
  {nm:'그리기',i:'✏️',t:[['rect','▭','사각'],['draw','╱','직선'],['circ','⚪','원형'],['hole','⊙','타공']]},
  {nm:'객체삽입',i:'🚰',t:[['place:sink','🚰','싱크볼'],['place:cook','🔥','쿡탑'],['place:dish','🍽','식기세척기'],['place:food','♻️','음식물투입구']]},
  {nm:'추가가공',i:'🛠',t:[['round','╭','모서리 라운드'],['flag:g','▨','밑면연마'],['flag:j','★','졸리컷'],['flag:s','▲','고스라']]},
  {nm:'기타 표기',i:'💬',t:[['a:circle','⭕','원형'],['a:text','T','텍스트 삽입'],['a:link','〰','연결표시'],['a:arrow','↗','지시선']]}];
var HOLES=['faucet','outlet','hole'];
var D=blank(),hist=[],mode='sel',view={s:0.12,ox:40,oy:120},draw=null,sel=null,K=null,openG=null,holeSub='faucet',pend=null,lastR=50;
function blank(){return{site:'',prod:'',memo:'',photos:[],pieces:[],objs:[],ann:[]};}
var $=function(id){return document.getElementById(id);},svg=$('cv');
function toast(t,ms){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none';},ms||2000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function snap(){hist.push(JSON.stringify({pieces:D.pieces,objs:D.objs,ann:D.ann}));if(hist.length>60)hist.shift();}
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
// 예전 형식 → 지금 형식 (e.m·mc = 마감 = 밑면연마+고스라), 닫는 변이 0이면 마지막 변을 닫는 변으로
function norm(){D.ann=D.ann||[];D.objs=D.objs||[];D.pieces.forEach(function(p){if(p.circ)return;
  (p.e||[]).forEach(function(e){if(e.m){e.g=e.s=true;}delete e.m;});if(p.mc)p.cf={g:true,s:true};delete p.mc;fixClose(p);});}
function fixClose(p){if(!p.closed||p.rect||p.circ||p.e.length<3)return;var v=verts(p),l=v[v.length-1];if(Math.hypot(l[0]-v[0][0],l[1]-v[0][1])<0.5){var last=p.e.pop();p.cf={g:!!last.g,s:!!last.s,j:!!last.j};}}

// ── 조각 계산 ──
function verts(p){if(p.circ)return[];var v=[[p.x0,p.y0]];p.e.forEach(function(e){var l=v[v.length-1],r=e.a*Math.PI/180;v.push([l[0]+e.L*Math.cos(r),l[1]+e.L*Math.sin(r)]);});

// 변 가공 값 = true(변 전체) 또는 [시작, 끝](변 시작점에서 mm, 끝점을 끌어서 정함)
function fl(o){return{g:(o&&o.g)||false,s:(o&&o.s)||false,j:(o&&o.j)||false};}
function rangeOf(v,L){if(!v)return null;if(v===true||!v.length)return[0,L];var a=Math.max(0,Math.min(L,v[0])),b=Math.max(0,Math.min(L,v[1]));return b-a>=1?[a,b]:null;}
// 변 s(segsR 결과)의 가공 구간: lo/hi = 표시 범위, A0/B0 = 그 끝점, A/B = 라운드 접점까지 줄인 끝

  ['g','s','j'].forEach(function(k){var r=rangeOf(s.f[k],s.L);if(!r)return;var lo=Math.max(r[0],t0),hi=Math.min(r[1],s.L-t1);if(hi-lo<0.5)return;
    out.push({k:k,lo:r[0],hi:r[1],A:at(lo),B:at(hi),A0:at(r[0]),B0:at(r[1]),full:r[0]<=0.5&&r[1]>=s.L-0.5});});return out;}
var MK={g:'grind',s:'gos',j:'jolly'};
function F(p,i){return i==='c'?(p.cf||(p.cf={})):p.e[i];} // 변 가공 표시 (바꿀 때)
function segs(p){if(p.circ)return[];var v=verts(p),S=[];p.e.forEach(function(e,i){S.push({i:i,a:v[i],b:v[i+1],L:e.L,f:fl(e)});});
  if(p.closed){var a=v[v.length-1],b=v[0];S.push({i:'c',a:a,b:b,L:Math.hypot(b[0]-a[0],b[1]-a[1]),f:fl(p.cf),auto:!p.rect});}return S;}

function inPoly(v,x,y){var c=false;for(var i=0,j=v.length-1;i<v.length;j=i++){var a=v[i],b=v[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}

  var a=Math.atan2(c.b[1]-c.a[1],c.b[0]-c.a[0])*180/Math.PI,r=((a%45)+45)%45;return r>0.5&&r<44.5;}
function bboxAll(){var l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;function add(x,y){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);}
  D.pieces.forEach(function(p){if(p.circ){add(p.x-p.d/2,p.y-p.d/2);add(p.x+p.d/2,p.y+p.d/2);}else verts(p).forEach(function(q){add(q[0],q[1]);});});

  return l===Infinity?null:{l:l,t:t,r:r,b:b};}
// 그 자리를 품은 (원형이 아닌) 닫힌 조각
function pieceAt(x,y){var best=null;D.pieces.forEach(function(p){if(!p.circ&&p.closed&&inPoly(polyOf(p),x,y))best=p;});return best;}
function isCut(p){return p.circ&&!!pieceAt(p.x,p.y);} // 원형이 다른 조각 안 = 원형 커팅(구멍)
function pbox(p){var v=verts(p),xs=v.map(function(q){return q[0];}),ys=v.map(function(q){return q[1];});return{l:Math.min.apply(null,xs),r:Math.max.apply(null,xs),t:Math.min.apply(null,ys),b:Math.max.apply(null,ys)};}
function outN(p,s){var dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],l=Math.hypot(dx,dy)||1,nx=dy/l,ny=-dx/l; // 변 바깥쪽 법선 (닫힌 조각이면 재료 반대쪽)
  if(p.closed&&inPoly(polyOf(p),(s.a[0]+s.b[0])/2+nx*2,(s.a[1]+s.b[1])/2+ny*2)){nx=-nx;ny=-ny;}return[nx,ny];}
function unit(a,b){var dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l,l];}
// 모서리 라운드: 꼭짓점 k(polyOf 순서, 사각 = 왼위·오위·오아래·왼아래) → 접점 P1·P2, 중심 C, 실제 R(변 절반까지), sw(화면 시계 방향이면 1)

    var tn=Math.tan(phi/2),t=R*tn,tm=Math.min(di[2],dO[2])/2;if(t>tm){t=tm;R=t/tn;}

    out[k]={t:t,R:R,P1:P1,P2:P2,C:[P1[0]+nr[0]*R,P1[1]+nr[1]*R],sw:cr>0?1:0,v:v,want:+p.r[k]};});return out;}
// 변 + 라운드로 줄인 끝 (a2,b2)
function segsR(p,RI){var S=segs(p),n=polyOf(p).length,ok=p.closed&&S.length===n;S.forEach(function(s,k){var t0=0,t1=0;
  if(ok){t0=RI[k]?RI[k].t:0;t1=RI[(k+1)%n]?RI[(k+1)%n].t:0;}var u=unit(s.a,s.b);s.a2=[s.a[0]+u[0]*t0,s.a[1]+u[1]*t0];s.b2=[s.b[0]-u[0]*t1,s.b[1]-u[1]*t1];});return S;}

// ── 화면 좌표 ──
function W2S(x,y){return[x*view.s+view.ox,y*view.s+view.oy];}
function S2W(x,y){return[(x-view.ox)/view.s,(y-view.oy)/view.s];}
function fit(){var B=bboxAll(),r=svg.getBoundingClientRect();if(!B||!r.width)return render();var pad=70,w=Math.max(200,B.r-B.l),h=Math.max(200,B.b-B.t);
  view.s=Math.min((r.width-pad*2)/w,(r.height-pad*2)/h,0.6);view.ox=(r.width-(B.l+B.r)*view.s)/2;view.oy=(r.height-(B.t+B.b)*view.s)/2;render();}

// ── 그리기 (화면·PNG 공통) ──  V: 도면 mm → 그림 px (확대·이동만), th: 색, f: 글자 크기
function star(cx,cy,r){var pts=[];for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*0.45:r;pts.push((cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a)));}return pts.join(' ');}

(function(){var it=(window._MALL_CATALOG&&window._MALL_CATALOG.items)||[],seen={},h='';it.forEach(function(x){var t=x.name+' '+(x.size||'');if(seen[t])return;seen[t]=1;h+='<option value="'+esc(t)+'">'+esc(x.en||'')+'</option>';});$('prod-list').innerHTML=h;})();
function renderPhotos(){$('photos').innerHTML=D.photos.map(function(p,i){return '<div><img src="'+p.d+'"><button data-pd="'+i+'">✕</button></div>';}).join('');}
$('photos').onclick=function(e){var d=e.target.dataset.pd;if(d!=null&&confirm('이 사진을 뺄까요?')){D.photos.splice(+d,1);renderPhotos();save();}};
$('b-photo').onclick=function(e){e.preventDefault();$('f-photo').click();};
$('f-photo').onchange=function(e){var fs=[].slice.call(e.target.files||[]);e.target.value='';var left=fs.length;if(!left)return;toast('사진 넣는 중…');
  fs.forEach(function(f){shrink(f,1600,0.8,function(d){if(d)D.photos.push({d:d,c:''});if(--left===0){renderPhotos();save();toast('사진 '+fs.length+'장 추가');}});});};
function shrink(file,max,q,cb){var url=URL.createObjectURL(file),img=new Image();img.onload=function(){var k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',q));};img.onerror=function(){URL.revokeObjectURL(url);cb(null);};img.src=url;}
// ── 파일: 새로 만들기 / 열기 / 저장 / 다른 이름 저장 ──
//   저장 = 이 휴대폰 IndexedDB에 이름 붙여 보관: 'files' = [{id,name,saved,n}], 'f:'+id = 실측 내용. 새로고침하면 빈 첫 화면(쓰던 것은 'doc2' 자동 저장 → 열기에서 이어서)
var cur=null,savedSig=null;
function sig(){return JSON.stringify([D.pieces,D.objs,D.ann,D.site,D.prod,D.memo,D.photos.length]);}
function dirty(){return sig()!==savedSig;}
function markSaved(){savedSig=sig();render();}
function kv(mode,key,val,cb){db(function(d){if(!d){if(cb)cb(null);return;}try{var st=d.transaction('kv',mode==='get'?'readonly':'readwrite').objectStore('kv'),rq=mode==='get'?st.get(key):mode==='del'?st.delete(key):st.put(val,key);
  rq.onsuccess=function(){if(cb)cb(mode==='get'?rq.result:true);};rq.onerror=function(){if(cb)cb(null);};}catch(e){if(cb)cb(null);}});}
function fileList(cb){kv('get','files',null,function(v){cb(v||[]);});}
function defName(){var d=new Date();return (D.site||'실측')+' '+(d.getMonth()+1)+'.'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function writeFile(id,name){keysCommit();endDraw();var doc=JSON.parse(JSON.stringify(D));
  kv('put','f:'+id,doc,function(ok){if(!ok){alert('저장하지 못했습니다 (휴대폰 저장 공간을 확인하세요).');return;}
    fileList(function(L){L=L.filter(function(x){return x.id!==id;});L.unshift({id:id,name:name,saved:Date.now(),n:D.pieces.length});kv('put','files',L,function(){
      cur={id:id,name:name};kv('put','cur2',cur);markSaved();toast('💾 저장했습니다 · '+name,1800);});});});}
function saveFile(){if(cur)writeFile(cur.id,cur.name);else saveFileAs();}
function saveFileAs(){keysCommit();askText('저장할 이름',cur?cur.name:defName(),function(n){if(!n)return;writeFile(nid(),n);});}
function guard(msg){return !dirty()||confirm((msg||'')+'저장하지 않은 내용이 있습니다. 저장하지 않고 계속할까요?');}
function loadDoc(doc,c,clean){D=Object.assign(blank(),doc);norm();hist=[];draw=null;sel=null;pend=null;K=null;keysRender();cur=c||null;kv('put','cur2',cur);
  $('files').style.display='none';$('info').style.display='none';openG=null;setMode('sel');savedSig=clean?sig():'';fit();save();}
function newFile(){keysCommit();endDraw();if(!guard())return;D=blank();hist=[];draw=null;sel=null;pend=null;K=null;keysRender();cur=null;kv('put','cur2',null);openG=null;
  view={s:0.12,ox:40,oy:120};setMode('sel');markSaved();toast('📄 새로 만들기',1200);}
function fmtD(t){var d=new Date(t);return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function openFiles(){keysCommit();endDraw();fileList(function(L){kv('get','doc2',null,function(auto){kv('get','cur2',null,function(ac){
  var h='',hasAuto=auto&&auto.pieces&&(auto.pieces.length||auto.objs&&auto.objs.length);
  if(hasAuto)h+='<button class="big" data-auto>⟲ 마지막 작업 이어서 <small style="color:var(--tx3)">(자동 저장'+(ac&&ac.name?' · '+esc(ac.name):'')+')</small></button>';
  h+='<button class="big" data-recv>📂 받은 파일 열기 (.ceramic)</button>';
  h+='<h4>이 휴대폰에 저장한 실측 ('+L.length+')</h4>';
  h+=L.length?L.map(function(x){return '<div class="fi'+(cur&&cur.id===x.id?' cur':'')+'" data-id="'+x.id+'"><div><b>'+esc(x.name)+'</b><small>'+fmtD(x.saved)+' · 조각 '+(x.n||0)+'개</small></div><button data-del="'+x.id+'">삭제</button></div>';}).join('')
    :'<div style="color:var(--tx3);font-size:13px;padding:8px 2px">아직 저장한 실측이 없습니다. 위 "💾 저장"으로 보관하세요.</div>';
  $('files-bd').innerHTML=h;$('files-bd').dataset.ac=JSON.stringify(ac||null);$('files').style.display='flex';});});});}
$('files-bd').addEventListener('click',function(e){var t=e.target.closest('[data-auto],[data-recv],[data-del],[data-id]');if(!t)return;
  if(t.dataset.recv!=null){$('f-file').click();return;}
  if(t.dataset.auto!=null){if(!guard())return;kv('get','doc2',null,function(d){if(d)loadDoc(d,JSON.parse($('files-bd').dataset.ac||'null'),false);toast('마지막 작업을 이어서 엽니다');});return;}
  if(t.dataset.del){var id=t.dataset.del;fileList(function(L){var x=L.filter(function(q){return q.id===id;})[0];if(!x||!confirm('"'+x.name+'"을(를) 이 휴대폰에서 지울까요?\n지우면 되돌릴 수 없습니다.'))return;
    kv('del','f:'+id,null,function(){kv('put','files',L.filter(function(q){return q.id!==id;}),function(){if(cur&&cur.id===id){cur=null;kv('put','cur2',null);}openFiles();});});});return;}
  var id2=t.dataset.id;if(!guard())return;fileList(function(L){var x=L.filter(function(q){return q.id===id2;})[0];if(!x)return;
    kv('get','f:'+id2,null,function(d){if(!d){alert('파일을 찾을 수 없습니다.');return;}loadDoc(d,{id:x.id,name:x.name},true);toast('📂 '+x.name);});});});
$('files-x').onclick=function(){$('files').style.display='none';};
$('f-file').onchange=function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;if(!guard())return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result),m=d.measure;
  if(!m||!m.doc){alert('심플 실측에서 만든 파일이 아니라서 열 수 없습니다.');return;}var doc=m.doc;doc.photos=m.photos||[];loadDoc(doc,null,false);toast('받은 파일을 열었습니다 · 💾 저장하면 보관됩니다',2400);}
  catch(ex){alert('파일을 읽을 수 없습니다.\n'+ex.message);}};r.readAsText(f);};
$('f-new').onclick=newFile;$('f-open').onclick=openFiles;$('f-save').onclick=saveFile;$('f-saveas').onclick=saveFileAs;
window.addEventListener('beforeunload',function(e){if(dirty()){e.preventDefault();e.returnValue='';}});

// ── 심플 캐드 파일 ──  사각 조각 = rect(코너 라운드 = corners), 그 밖 = 선(line)들 + 라운드 = 호(arc), 원형 = circle(원형 커팅),
//   밑면연마 = grindregion(50) / 고스라 = gosramark (재료 쪽, 앱이 정함) / 졸리컷 = jollymark, 싱크볼 = 고스라 4개 묶음, 쿡탑·식기세척기·사각타공 = 묶음 rect, 수전·콘센트·음식물 = circle
//   표기: 글자 = note, 지시선 = arrow(+글자 note), 연결표시 = linkmark. 원형 표시는 본앱에 맞는 도형이 없어 실측 그림·measure.doc에만
var ANN_COL='#1F3F7A';
function toSimplecad(){
  var shapes=[],id=1;function mk(k,o){var s={id:id++,kind:k,ops:[]};for(var q in o)s[q]=o[q];shapes.push(s);return s;}
  D.pieces.forEach(function(p){
    if(p.circ){mk('circle',{cx:p.x,cy:p.y,r:p.d/2,holeType:'cut'});return;}
    if(!p.closed||p.e.length<2)return;var RI=roundInfo(p),S=segsR(p,RI),isRect=p.rect&&p.e.every(function(e){return e.a%90===0;});
    if(isRect){var B=pbox(p),r={x:B.l,y:B.t,w:B.r-B.l,h:B.b-B.t,rotation:0,cornerType:'none',cornerSize:0},CK=['tl','tr','br','bl'];
      if(p.r&&Object.keys(RI).length){r.corners={};Object.keys(RI).forEach(function(k){r.corners[CK[k]]={type:'fillet',r:Math.round(RI[k].R*10)/10};});}mk('rect',r);}
    else{S.forEach(function(s){if(Math.hypot(s.b2[0]-s.a2[0],s.b2[1]-s.a2[1])>=0.5)mk('line',{x1:s.a2[0],y1:s.a2[1],x2:s.b2[0],y2:s.b2[1]});});
      Object.keys(RI).forEach(function(k){var q=RI[k],a1=Math.atan2(q.P1[1]-q.C[1],q.P1[0]-q.C[0]),a2=Math.atan2(q.P2[1]-q.C[1],q.P2[0]-q.C[0]);
        mk('arc',q.sw?{cx:q.C[0],cy:q.C[1],r:q.R,a0:a1,a1:a2}:{cx:q.C[0],cy:q.C[1],r:q.R,a0:a2,a1:a1});});}
    S.forEach(function(s){if(s.L<1)return;var n=outN(p,s),dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],sg=Math.abs(dy)<Math.abs(dx)?(n[1]>0?-1:1):(n[0]>0?-1:1); // 재료 쪽 = 바깥 반대
      spans(s).forEach(function(m){var A=isRect?m.A0:m.A,Bp=isRect?m.B0:m.B,c={x1:A[0],y1:A[1],x2:Bp[0],y2:Bp[1]};
        if(m.k==='g')mk('grindregion',Object.assign({depth:50,inward:sg},c));
        if(m.k==='s')mk('gosramark',Object.assign({outward:sg,hideDims:{dist:true}},c));
        if(m.k==='j')mk('jollymark',c);});});});
  D.objs.forEach(function(o){if(OBJ[o.t].d){mk('circle',{cx:o.x,cy:o.y,r:o.d/2,holeType:o.t});return;}var x=o.x-o.w/2,y=o.y-o.h/2,w=o.w,h=o.h,g='grp'+id;
    var rr=objR(o);
    if(o.t==='sink'){mk('rect',{x:x,y:y,w:w,h:h,cornerType:rr>0?'fillet':'none',cornerSize:rr,groupId:g,groupRole:'main',applianceType:'sink'});
      [['top',x,y,x+w,y,-1],['bottom',x,y+h,x+w,y+h,1],['left',x,y,x,y+h,1],['right',x+w,y,x+w,y+h,-1]].forEach(function(q){mk('gosramark',{x1:q[1],y1:q[2],x2:q[3],y2:q[4],outward:q[5],groupId:g,groupRole:q[0],hideDims:{dist:true}});});}
    else mk('rect',{x:x,y:y,w:w,h:h,cornerType:rr>0?'fillet':'none',cornerSize:rr,groupId:g,groupRole:'main',applianceType:o.t});});
  D.ann.forEach(function(a){
    if(a.t==='text')mk('note',{x:a.x,y:a.y,text:a.text,fs:32,color:ANN_COL});
    else if(a.t==='link')mk('linkmark',{x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2,color:ANN_COL});
    else if(a.t==='arrow'){mk('arrow',{x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2,bend:0,color:ANN_COL});if(a.text)mk('note',{x:a.x1,y:a.y1,text:a.text,fs:32,color:ANN_COL});}});
  var si=(D.site||'').split('/'),now=new Date().toISOString();
  return{version:3,products:prodOut(),company:(si[0]||'').trim(),siteAddr:si.slice(1).join('/').trim(),delivDate:'',delivTime:'',shapes:shapes,
    measure:{v:2,app:'심플 실측 '+VER,memo:D.memo,photos:D.photos,doc:{site:D.site,prod:D.prod,memo:D.memo,pieces:D.pieces,objs:D.objs,ann:D.ann},created:now},saved:now};
}
function prodOut(){var s=(D.prod||'').trim();if(!s)return[{name:'',size:'',qty:1}];var m=s.match(/^(.*?)\s*(\d{3,4}\s*[×xX*]\s*\d{3,4}(?:\s*[×xX*]\s*\d+\s*T?)?)\s*$/);
  return[{name:m?m[1].trim():s,size:m?m[2].replace(/\s+/g,'').replace(/[xX*]/g,'×'):'',qty:1}];}
function baseName(){var d=new Date(),ymd=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2),b=(D.site||(cur&&cur.name)||'').replace(/\s*\/\s*/g,'-').replace(/[\\\/:*?"<>|]+/g,' ').trim();return (b?b+'-':'')+ymd+'-실측';}
// 그림(PNG): 흰 바탕, 위에 현장·제품·날짜, 객체 위치 치수까지 — 문자로도 보이게
function pngBlob(cb){
  var B=bboxAll();if(!B)return cb(null,null);var Wd=1400,pad=120,top=120,w=Math.max(200,B.r-B.l),h=Math.max(200,B.b-B.t),s=Math.min((Wd-pad*2)/w,1.2),Hd=Math.round(h*s+pad*2+top);
  var V=function(x,y){return[(x-B.l)*s+pad,(y-B.t)*s+pad+top];},keep=sel;sel=null;
  var body=paint(V,{halo:'#fff',bg:'#fff',fill:'#F4F6FA',fillSel:'#F4F6FA',line:'#1C2A47',grind:'#E8590C',grindBg:'rgba(232,89,12,.10)',gos:'#111',jolly:'#D32F2F',
    dim:'#111',auto:'#555',selc:'#1565C0',obj:'#8a5a00',hole:'#0b6e99',odim:'#666',ann:'#C62828',allDims:true},28);sel=keep;
  var head='<text x="40" y="56" font-size="36" font-weight="bold" fill="#111">'+esc(D.site||(cur&&cur.name)||'현장 실측')+'</text><text x="40" y="98" font-size="25" fill="#444">'+esc((D.prod?D.prod+' · ':'')+new Date().toLocaleDateString('ko-KR'))+' · ▨ 밑면연마 · ▲ 고스라 · ★ 졸리컷 · 단위 mm</text>';
  var x='<svg xmlns="http://www.w3.org/2000/svg" width="'+Wd+'" height="'+Hd+'" viewBox="0 0 '+Wd+' '+Hd+'" font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect width="100%" height="100%" fill="#fff"/>'+head+body+'</svg>';
  var url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x),img=new Image();
  img.onload=function(){var c=document.createElement('canvas');c.width=Wd;c.height=Hd;c.getContext('2d').drawImage(img,0,0);try{c.toBlob(function(b){cb(b,b?URL.createObjectURL(b):url);},'image/png');}catch(e){cb(null,url);}};
  img.onerror=function(){cb(null,null);};img.src=url;
}
// 보내기: 파일을 먼저 만들어 두고(아이폰은 공유를 누른 그 순간에 바로 열어야 해서) 창에서 "카톡·문자로 보내기"
var SEND=null;
$('b-send').onclick=function(){
  keysCommit();endDraw();openG=null;pend=null;setMode('sel');
  if(!D.pieces.some(function(p){return p.closed;})){toast('먼저 상판을 그리세요');return;}
  var nm=baseName(),txt=JSON.stringify(toSimplecad());
  pngBlob(function(png,pv){
    var files=[];try{files.push(new File([txt],nm+'.ceramic',{type:'application/json'}));if(png)files.push(new File([png],nm+'.png',{type:'image/png'}));}catch(e){}
    var can=function(l){try{return !!(navigator.canShare&&l.length&&navigator.canShare({files:l}));}catch(e){return false;}};
    SEND={nm:nm,txt:txt,png:png,list:can(files)?files:can(files.slice(0,1))?files.slice(0,1):null};
    $('send-pv').src=pv||'';$('send-nm').innerHTML='📄 '+esc(nm)+'.ceramic'+(png?'<br>🖼 '+esc(nm)+'.png':'')+(SEND.list&&SEND.list.length<files.length?'<br><span style="color:#ff9a8a">이 휴대폰은 그림 파일을 같이 보낼 수 없어 도면 파일만 보냅니다</span>':'');
    $('send-share').style.display=SEND.list?'block':'none';$('send').style.display='flex';
  });
};
$('send-share').onclick=function(){if(!SEND||!SEND.list)return;navigator.share({files:SEND.list,title:SEND.nm}).then(function(){toast('보냈습니다');}).catch(function(e){if(e&&e.name!=='AbortError')toast('보내지 못했어요 — 휴대폰에 저장 후 보내 주세요',3000);});};
$('send-save').onclick=function(){if(!SEND)return;download(new Blob([SEND.txt],{type:'application/octet-stream'}),SEND.nm+'.ceramic');if(SEND.png)setTimeout(function(){download(SEND.png,SEND.nm+'.png');},500);toast('다운로드 폴더에 저장했습니다',2600);};
$('send-x').onclick=function(){$('send').style.display='none';};
function download(blob,nm){var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=nm;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);}

// ── 이 기기에 자동 저장 (IndexedDB) ──
var _db=null;
function db(cb){if(_db)return cb(_db);try{var rq=indexedDB.open('simple-measure',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('kv');};rq.onsuccess=function(){_db=rq.result;cb(_db);};rq.onerror=function(){cb(null);};}catch(e){cb(null);}}
function save(){clearTimeout(save.t);save.t=setTimeout(function(){if(!D.pieces.length&&!D.objs.length&&!D.ann.length)return; // 빈 화면은 자동 저장 안 함 (지난 작업을 지우지 않게)
  db(function(d){if(!d)return;try{d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(D)),'doc2');}catch(e){}});},400);}
window.addEventListener('resize',function(){renderRail();render();});
savedSig=sig();renderRail();render(); // 새로고침 = 빈 첫 화면 (자동 저장본 'doc2'는 지우지 않음 → 열기에서 "마지막 작업 이어서")
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
</script>
